# Nombre de la aplicacion
spring.application.name=huerto-backend

# Puerto del backend
server.port=8081

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/huertohogar_demo
spring.datasource.username=huerto_app
spring.datasource.password=${HUERTO_DB_PASSWORD}
app.jwt.secret=${HUERTO_JWT_SECRET}

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true